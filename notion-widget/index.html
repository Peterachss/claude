<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forest widget</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#191919;--card:#202b23;--line:#2c3a30;--digit:#d6ecd9;--accent:#6fbf86;--muted:#7f8a82}
@media (prefers-color-scheme: light){:root{--bg:#ffffff;--card:#eef5ef;--line:#d5e5d8;--digit:#1f4d2e;--accent:#2f7d4a;--muted:#6b766d}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--digit);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
.wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px 14px}
.hi{font-size:13px;color:var(--muted);letter-spacing:.04em}
.hi b{color:var(--accent);font-weight:600}
.clock{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:5px;align-items:center}
.d{background:var(--card);border:1px solid var(--line);border-radius:8px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,11vw,46px);font-weight:700;position:relative}
.d::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--bg);opacity:.7}
.colon{color:var(--accent);font-size:clamp(16px,7vw,30px);padding:0 1px}
.date{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#t{font-size:22px;font-weight:700}
.btns{display:flex;gap:6px}
button{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 10px;font:inherit;font-size:11px;cursor:pointer}
button:hover{background:var(--accent);color:var(--bg)}
.bar{height:6px;background:var(--card);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.big{font-size:22px;font-weight:700}
.small{font-size:11px;color:var(--muted)}
.quote{font-size:12px;color:var(--muted);line-height:1.5;border-left:2px solid var(--accent);padding-left:10px}
</style></head><body>
<div class="wrap">
  <div class="hi"><span id="greet"></span><span id="nm"></span></div>
  <div class="clock"><div class="d" id="h1">0</div><div class="d" id="h2">0</div><span class="colon">:</span><div class="d" id="m1">0</div><div class="d" id="m2">0</div></div>
  <div class="date" id="date"></div>
  <div class="box">
    <div class="lbl">focus</div>
    <div class="row"><span id="t">25:00</span><span class="btns"><button id="go">start</button><button id="rs">reset</button></span></div>
    <div class="bar"><i id="fb"></i></div>
  </div>
  <div class="box">
    <div class="lbl">until end-of-year exams</div>
    <div class="row"><span class="big" id="ex"></span><span class="small" id="yr"></span></div>
    <div class="bar"><i id="yb"></i></div>
  </div>
  <div class="quote">Grow a little every day.<br>Check Today → one thing from Countdown → close the laptop.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const name=new URLSearchParams(location.search).get('name');
if(name){const b=document.createElement('b');b.textContent=name.slice(0,30);$('nm').append(', ',b);}
const START=new Date(2026,7,17),EXAMS=new Date(2027,4,17),DAY=86400000;
function tick(){const n=new Date(),H=n.getHours(),h=String(H).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
$('h1').textContent=h[0];$('h2').textContent=h[1];$('m1').textContent=m[0];$('m2').textContent=m[1];
$('date').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
$('greet').textContent=H<12?'good morning':H<18?'good afternoon':'good evening';
$('ex').textContent=Math.max(0,Math.ceil((EXAMS-n)/DAY))+' days';
const p=Math.min(100,Math.max(0,(n-START)/(EXAMS-START)*100));$('yb').style.width=p.toFixed(1)+'%';$('yr').textContent=Math.round(p)+'% of the year';}
tick();setInterval(tick,1000);
const FULL=1500;let left=FULL,timer=null;
function show(){$('t').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('fb').style.width=((FULL-left)/FULL*100)+'%';}
$('go').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('go').textContent='start';return;}
$('go').textContent='pause';timer=setInterval(()=>{left--;show();if(left<=0){clearInterval(timer);timer=null;$('go').textContent='start';left=FULL;$('t').textContent='break';}},1000);};
$('rs').onclick=()=>{clearInterval(timer);timer=null;left=FULL;$('go').textContent='start';show();};
</script>
</body></html>
